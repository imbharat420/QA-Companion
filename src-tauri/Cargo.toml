[package]
name = "aether-qa-companion"
version = "1.0.0"
description = "Autonomous AI QA engineering companion"
authors = ["Aether"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "aether_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
tokio = { version = "1", features = ["time", "sync", "macros", "rt-multi-thread"] }

[features]
default = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
